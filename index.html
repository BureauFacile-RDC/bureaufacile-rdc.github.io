html{scroll-padding-top:env(safe-area-inset-top,0px)}

p{margin:0 0 12px}.mut{color:var(--mut)}small{color:var(--mut)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 18px;border-radius:12px;border:2px solid transparent;font:inherit;font-weight:700;text-decoration:none;cursor:pointer;background:var(--pri);color:var(--on)}
.btn.y{background:var(--sun);color:var(--tx)}
.btn.o{background:transparent;border-color:currentColor;color:inherit}

.btn:focus-visible,.row:focus-visible,nav button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--cy);outline-offset:2px}

.banner i{display:block;width:72px;height:3px;margin:8px auto 0;border-radius:2px;background:#7fe9f7}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}

.tabs{display:flex;gap:6px;overflow-x:auto;margin:12px 0}

.tabs button.on{background:var(--pri);color:var(--on);border-color:var(--pri)}
.fbtn{display:block;width:100%;margin-top:8px;padding:10px 14px;min-height:48px;text-align:left;white-space:normal;overflow-wrap:anywhere;word-break:break-all;line-height:1.3;border:2px solid currentColor;border-radius:12px;background:transparent;color:inherit;font:inherit;font-weight:700;cursor:pointer}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-weight:700;font-size:.85rem;background:var(--sun);color:var(--tx)}
.badge.dv{background:var(--red);color:#fff}
.big{font-size:3rem;line-height:1}
label{display:block;font-weight:650;margin:14px 0 6px}
input,select,textarea{width:100%;min-height:48px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--tx);font:inherit}
textarea{min-height:110px;resize:vertical}
.err{color:var(--red);font-weight:650;margin-top:10px;min-height:1.4em}
.back{background:none;border:0;color:var(--mut);font:inherit;padding:8px 0;cursor:pointer}
.ticket{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;margin:14px 0}
.ticket::before,.ticket::after{content:"";position:absolute;top:58px;width:18px;height:18px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.ticket::before{left:-10px}.ticket::after{right:-10px}
.ticket .no{font:800 1.3rem/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.04em}
.ticket .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-bottom:22px;border-bottom:2px dashed var(--line);margin-bottom:12px}
.ticket .stamp{border:2px solid var(--red);color:var(--red);border-radius:6px;padding:2px 8px;font-weight:800;font-size:.85rem;transform:rotate(-4deg)}
.steps{display:flex;gap:4px;margin:12px 0 4px}
.steps i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.steps i.on{background:var(--ok)}
.steps+.lbl{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;font-size:.7rem;color:var(--mut)}
.steps+.lbl b{color:var(--tx)}
.mini{background:none;border:1px dashed var(--mut);color:var(--mut);border-radius:8px;padding:6px 10px;font:inherit;font-size:.8rem;margin-top:10px;cursor:pointer}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;min-width:0;min-height:60px;padding:0 2px;background:none;border:0;color:var(--mut);font:inherit;font-size:.76rem;line-height:1.15;white-space:nowrap;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button span{font-size:1.4rem;line-height:1}
nav button.on{color:var(--pri);font-weight:800;box-shadow:inset 0 3px 0 var(--cy)}
.files{font-size:.9rem;color:var(--mut)}
</style>
</head>

 const h=Object.assign({apikey:SUPABASE_KEY},o.tok?{Authorization:"Bearer "+o.tok}:{},o.headers||{});
 const ctl=o.timeout?new AbortController():null,tm=ctl?setTimeout(()=>ctl.abort(),o.timeout):0;
 let r,t;
 try{r=await fetch(SUPABASE_URL+path,{method:o.method||"GET",headers:h,body:o.body,signal:ctl?ctl.signal:undefined});t=await r.text()}
 catch(e){throw e&&e.name==="AbortError"?new Error("Délai dépassé"):e}
 finally{if(tm)clearTimeout(tm)}let j=null;try{j=t?JSON.parse(t):null}catch(e){}
 if(!r.ok)throw new Error((j&&(j.message||j.msg||j.error_description||j.error))||("Erreur "+r.status));
 return j;

async function send(){
 if(busy)return;
 const g=i=>$("#"+i).value.trim(),sid=+$("#fs").value,n=g("fn"),t=g("ft"),d=g("fd"),pg=g("fp"),err=m=>{$("#err").textContent=m};
 if(!sid||n.length<2||d.length<3)return err("Choisissez un service, puis remplissez votre nom et la description.");
 if(t.replace(/\D/g,"").length<8)return err("Le numéro de téléphone est obligatoire pour que nous puissions vous contacter.");
 const files=[...$("#ff").files];
 if(files.length>5)return err("5 fichiers maximum.");
 for(const f of files){if(f.size>10485760)return err(f.name+" dépasse 10 Mo.");if(!OK.includes(f.type))return err(f.name+" : ce type de fichier n’est pas accepté.")}
 busy=true;const b=$("#sb");b.disabled=true;b.textContent="Envoi en cours…";err("");
 try{
  const r=(await rpc("create_request",{p_name:n,p_phone:t,p_service_id:sid,p_description:d,p_pages:pg?+pg:null}))[0],failed=[];
  for(const f of files){
   try{
    const path=r.new_id+"/"+Date.now()+"_"+clean(f.name);
    await api("/storage/v1/object/client-files/"+path,{method:"POST",headers:{"Content-Type":f.type},body:f});
    await rpc("register_file",{p_request_id:r.new_id,p_file_name:f.name,p_storage_path:path,p_size_bytes:f.size});
   }catch(e){failed.push(f.name)}
  }
  const rec={no:r.new_order_number,phone:t,name:n,sid,date:new Date().toLocaleDateString("fr-FR")};
  saveMY([rec,...MY()]);last={...rec,failed,nfiles:files.length};busy=false;go("done");
 }catch(e){busy=false;b.disabled=false;b.textContent="Envoyer la demande";err("Échec de l’envoi : "+e.message)}
}
function done(){
 const r=last;if(!r)return track();
 const s=svc(r.sid),m="Bonjour "+C.name+", ma demande "+r.no+" : "+s.n+". Nom : "+r.name+". Pouvez-vous me confirmer le prix et le paiement ?";
 return `<h1>Votre demande a bien été reçue</h1><p class="mut">Votre numéro de commande est <b>${esc(r.no)}</b>. Gardez-le pour suivre votre demande.</p>

 ${r.failed.length?`<p class="warn">Ces fichiers n’ont pas pu être envoyés : ${r.failed.map(esc).join(", ")}. Envoyez-les-nous par WhatsApp.</p>`:""}

 <button class="btn w" onclick="go('track')">Suivre ma demande</button>`;
}
const steps=st=>`<div class="steps">${ST.map((x,k)=>`<i class="${k<=st?"on":""}"></i>`).join("")}</div><div class="lbl">${ST.map((x,k)=>k===st?`<b>${x}</b>`:`<span>${x}</span>`).join("")}</div>`;

async function loadMy(){

 const out=await Promise.all(MY().map(async m=>{try{return {m,r:(await rpc("track_request",{p_order_number:m.no,p_phone:m.phone}))[0]}}catch(e){return {m,r:null}}}));
 const b2=$("#mylist");if(!b2)return;
 b2.innerHTML=out.map(({m,r})=>{const st=r?CODE.indexOf(r.status):-1;return `<div class="ticket"><div class="hd"><span class="no">${esc(m.no)}</span><span class="stamp">${st>=0?ST[st]:"?"}</span></div><h3>${esc(r?r.service_name:svc(m.sid).n)}</h3><p class="mut">${esc(m.date)}</p>${st>=0?steps(st):`<p class="mut">Statut indisponible pour le moment.</p>`}</div>`}).join("");

async function findReq(){
 const n=$("#tn").value.trim().toUpperCase(),p=$("#tp").value.trim(),e=$("#terr");
 if(!/^BF-\d+$/.test(n)||p.replace(/\D/g,"").length<8){e.textContent="Entrez un numéro valide (ex. BF-0001) et le téléphone utilisé.";return}
 try{
  const r=await rpc("track_request",{p_order_number:n,p_phone:p});
  if(!r.length){e.textContent="Aucune demande trouvée avec ces informations.";return}
  const L=MY();if(!L.some(x=>x.no===n))saveMY([{no:n,phone:p,name:"",sid:0,date:new Date(r[0].created_at).toLocaleDateString("fr-FR")},...L]);
  render();
 }catch(x){e.textContent="Recherche impossible : "+x.message}
}

async function login(){
 const e=$("#ae").value.trim(),p=$("#ap").value,er=$("#aerr");
 try{
  const s=await api("/auth/v1/token?grant_type=password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:e,password:p})});
  if((await rpc("is_admin",{},s.access_token))!==true){er.textContent="Ce compte n’est pas administrateur.";return}
  SES={tok:s.access_token};try{sessionStorage.setItem("bf_ses",JSON.stringify(SES))}catch(x){}
  render();
 }catch(x){er.textContent="Connexion refusée : "+x.message}
}
function logout(){SES=null;ADM=[];try{sessionStorage.removeItem("bf_ses")}catch(e){}go("home")}
async function loadAdmin(){
 try{[ADM,ASV,ASET]=await Promise.all([api("/rest/v1/requests?select=*,services(name,icon),request_files(*)&order=created_at.desc",{tok:SES.tok}),api("/rest/v1/services?select=*&order=sort_order",{tok:SES.tok}),api("/rest/v1/settings?select=*&id=eq.1",{tok:SES.tok}).then(r=>r[0]||null)]);drawAdmin()}
 catch(e){if(/JWT|expired|401/i.test(e.message)){logout();return}const b=$("#adm");if(b)b.innerHTML=`<p class="warn">${esc(e.message)}</p>`}
}
function drawAdmin(){
 const box=$("#adm");if(!box)return;
 const top=`<div class="tabs">${[["req","Demandes"],["svc","Services"],["set","Coordonnées"]].map(([k,n])=>`<button class="${atab===k?"on":""}" onclick="atab='${k}';edit=null;drawAdmin()">${n}</button>`).join("")}</div>`;
 if(atab==="svc"){box.innerHTML=`<p><button class="mini" onclick="logout()">Se déconnecter</button> <button class="mini" onclick="loadAdmin()">Actualiser</button></p>`+top+svcPanel();return}
 if(atab==="set"){box.innerHTML=`<p><button class="mini" onclick="logout()">Se déconnecter</button> <button class="mini" onclick="loadAdmin()">Actualiser</button></p>`+top+setPanel();return}
 const g=r=>r.status==="recue"?"0":r.status==="en_traitement"?"1":"2",cnt=k=>ADM.filter(r=>g(r)===k).length;
 const tabs=[["all","Toutes",ADM.length],["0","En attente",cnt("0")],["1","En traitement",cnt("1")],["2","Terminées",cnt("2")]];
 const L=ADM.filter(r=>af==="all"||g(r)===af);
 box.innerHTML=`<p><button class="mini" onclick="logout()">Se déconnecter</button> <button class="mini" onclick="loadAdmin()">Actualiser</button></p>${top}
 <div class="tabs">${tabs.map(([k,n,v])=>`<button class="${af===k?"on":""}" onclick="af='${k}';drawAdmin()">${n} (${v})</button>`).join("")}</div>

async function dl(id){
 const f=ADM.flatMap(r=>r.request_files||[]).find(x=>x.id===id);if(!f)return;
 try{
  const s=await api("/storage/v1/object/sign/client-files/"+f.storage_path,{method:"POST",tok:SES.tok,headers:{"Content-Type":"application/json"},body:JSON.stringify({expiresIn:300})});
  const a=document.createElement("a");a.href=SUPABASE_URL+"/storage/v1"+s.signedURL+"&download="+encodeURIComponent(f.file_name);document.body.appendChild(a);a.click();a.remove();
 }catch(e){alert("Téléchargement impossible : "+e.message)}
}
async function setSt(id,code){
 try{
  await api("/rest/v1/requests?id=eq."+id,{method:"PATCH",tok:SES.tok,headers:{"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify({status:code})});
  const r=ADM.find(x=>x.id===id);if(r)r.status=code;drawAdmin();
 }catch(e){alert("Modification impossible : "+e.message)}
}

async function saveSvc(){
 const v=i=>$("#"+i).value.trim(),er=$("#serr");
 const o={name:v("sn"),icon:v("si")||"📄",description:v("sd"),price:v("sp")||null,price_extra:v("sx")||null,delay:v("sl"),active:v("sa")==="1"};
 if(o.name.length<2){er.textContent="Le nom du service est obligatoire.";return}
 try{
  if(edit)await patch("/rest/v1/services?id=eq."+edit,o);
  else{
   o.sort_order=Math.max(0,...ASV.map(x=>x.sort_order||0))+1;
   await api("/rest/v1/services",{method:"POST",tok:SES.tok,headers:{"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify(o)});
  }
  edit=null;await loadAdmin();refreshPublic();
 }catch(e){er.textContent="Enregistrement impossible : "+e.message}
}

async function saveSet(){

 const o={business_name:v("cn"),slogan:v("cs"),whatsapp:v("cw").replace(/\D/g,""),phone:v("cp"),address:v("ca"),hours:v("ch"),price_notice:v("cm")};
